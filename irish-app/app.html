<title>Cúpla Focal</title>
<meta name="description" content="Bite-size Irish lessons with a Munster, Connacht and Ulster dialect switch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&family=Uncial+Antiqua&display=swap">
<style>
/* Layout: a one-column phone app. Status bar on top, a winding lesson path in the middle, tabs at the bottom; a lesson takes over the whole screen. */
:root {
  --moss: #1c9a55;
  --moss-deep: #127540;
  --moss-tint: #dcf5e6;
  --moss-ink: #0e6a37;
  --on-moss: #ffffff;
  --gorse: #f3b604;
  --gorse-deep: #c28e00;
  --gorse-tint: #fff4cc;
  --gorse-ink: #8a6400;
  --on-gorse: #3a2a00;
  --turf: #ee7518;
  --atlantic: #1f78b4;
  --atlantic-deep: #165b8a;
  --atlantic-tint: #dfeefa;
  --atlantic-ink: #135580;
  --on-atlantic: #ffffff;
  --fuchsia: #d4336b;
  --fuchsia-deep: #a1214d;
  --fuchsia-tint: #fde4ed;
  --fuchsia-ink: #a1214d;
  --on-fuchsia: #ffffff;
  --bg: #f5f8f3;
  --surface: #ffffff;
  --line: #dce4d9;
  --line-deep: #c3cebf;
  --locked: #e2e8df;
  --ink: #1c281f;
  --ink-soft: #5a685e;
  --puffin: #252a33;
  --puffin-face: #f6f6f2;
  --beak: #f05d2a;
  --beak-band: #8b9cb2;
  --scrim: rgba(18, 30, 22, .5);
  --font-display: "Baloo 2", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-gael: "Uncial Antiqua", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --moss: #2fbf6e; --moss-deep: #1d8a4c; --moss-tint: #133222; --moss-ink: #7fe3a8; --on-moss: #04150b;
    --gorse: #f6c535; --gorse-deep: #a98200; --gorse-tint: #3a3010; --gorse-ink: #f6c535; --on-gorse: #2a1f00;
    --turf: #ff9142;
    --atlantic: #5aaee8; --atlantic-deep: #2f78ad; --atlantic-tint: #13293a; --atlantic-ink: #a6d5f6; --on-atlantic: #06182a;
    --fuchsia: #f0628f; --fuchsia-deep: #b23a61; --fuchsia-tint: #3b1623; --fuchsia-ink: #ff9cbc; --on-fuchsia: #26060f;
    --bg: #0f1612; --surface: #172119; --line: #29382c; --line-deep: #1b261d; --locked: #243128;
    --ink: #e6eee8; --ink-soft: #9db0a2;
    --puffin: #333c4a; --puffin-face: #eef0ec; --beak: #ff6a35; --beak-band: #a2b2c6;
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --moss: #2fbf6e; --moss-deep: #1d8a4c; --moss-tint: #133222; --moss-ink: #7fe3a8; --on-moss: #04150b;
  --gorse: #f6c535; --gorse-deep: #a98200; --gorse-tint: #3a3010; --gorse-ink: #f6c535; --on-gorse: #2a1f00;
  --turf: #ff9142;
  --atlantic: #5aaee8; --atlantic-deep: #2f78ad; --atlantic-tint: #13293a; --atlantic-ink: #a6d5f6; --on-atlantic: #06182a;
  --fuchsia: #f0628f; --fuchsia-deep: #b23a61; --fuchsia-tint: #3b1623; --fuchsia-ink: #ff9cbc; --on-fuchsia: #26060f;
  --bg: #0f1612; --surface: #172119; --line: #29382c; --line-deep: #1b261d; --locked: #243128;
  --ink: #e6eee8; --ink-soft: #9db0a2;
  --puffin: #333c4a; --puffin-face: #eef0ec; --beak: #ff6a35; --beak-band: #a2b2c6;
  --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font: 600 16px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:not(:disabled) { cursor: pointer; }
a { color: var(--atlantic-ink); }
:focus-visible { outline: 3px solid var(--atlantic); outline-offset: 2px; }
svg { display: block; }

#app { height: 100%; max-width: 560px; margin-inline: auto; padding-inline: 16px; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Status bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; border-bottom: 2px solid var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; border: 2px solid var(--line); border-bottom-width: 3px; background: var(--surface); color: var(--ink); font: 800 14px/1 var(--font-body); }
.chip svg { width: 18px; height: 18px; color: var(--atlantic); }
.stats { display: flex; align-items: center; gap: 14px; font: 800 17px/1 var(--font-display); }
.stat { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.stat svg { width: 22px; height: 22px; }
.stat.streak { color: var(--turf); }
.stat.streak.cold { color: var(--ink-soft); }
.stat.xp { color: var(--gorse-ink); }
.stat.hearts { color: var(--fuchsia); }

.panes { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin-inline: -16px; padding: 16px 16px 28px; }
.pane { display: grid; gap: 14px; align-content: start; }

/* Bottom tabs */
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 2px solid var(--line); padding-block: 8px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border: 2px solid transparent; border-radius: 14px; background: none; color: var(--ink-soft); font: 800 12px/1.1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--atlantic-ink); background: var(--atlantic-tint); border-color: var(--atlantic); }

/* Daily goal + unit banner */
.goal { display: grid; gap: 8px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); }
.goal-text { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.goal-l { font: 800 15px/1.2 var(--font-body); }
.goal-n { font: 800 15px/1.2 var(--font-display); color: var(--gorse-ink); font-variant-numeric: tabular-nums; }
.gbar { height: 12px; border-radius: 999px; background: var(--locked); overflow: hidden; }
.gbar > i { display: block; height: 100%; border-radius: inherit; background: var(--gorse); transition: width .4s ease; }

.unit { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-radius: 18px; background: var(--moss); color: var(--on-moss); box-shadow: 0 5px 0 var(--moss-deep); }
.unit-text { min-width: 0; }
.unit-eyebrow { font: 800 12px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.unit-title { margin: 6px 0 0; font: 400 27px/1.15 var(--font-gael); text-wrap: balance; }
.unit-sub { margin: 4px 0 0; font: 700 15px/1.35 var(--font-body); opacity: .92; }
.unit-guide { flex: none; display: inline-flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 12px; border-radius: 14px; border: 2px solid color-mix(in srgb, var(--on-moss) 40%, transparent); background: transparent; color: var(--on-moss); font: 800 12px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; }
.unit-guide svg { width: 24px; height: 24px; }
.unit.next { background: var(--surface); color: var(--ink-soft); box-shadow: none; border: 2px dashed var(--line-deep); }
.unit.next > svg { width: 28px; height: 28px; flex: none; }

/* Lesson path */
.path { position: relative; display: flex; flex-direction: column; align-items: center; gap: 34px; padding-block: 52px 40px; }
.node-row { position: relative; transform: translateX(var(--x, 0px)); display: flex; justify-content: center; }
.node { position: relative; width: 76px; height: 68px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--moss); color: var(--on-moss); box-shadow: 0 7px 0 var(--moss-deep); transition: transform .08s, box-shadow .08s; }
.node svg { width: 34px; height: 34px; }
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--moss-deep); }
.node.done { background: var(--gorse); color: var(--on-gorse); box-shadow: 0 7px 0 var(--gorse-deep); }
.node.done:active { box-shadow: 0 2px 0 var(--gorse-deep); }
.node.locked { background: var(--locked); color: var(--ink-soft); box-shadow: 0 7px 0 var(--line-deep); }
.node.locked:active { box-shadow: 0 2px 0 var(--line-deep); }
.node.current::before { content: ""; position: absolute; inset: -10px -10px -17px; border-radius: 50%; border: 5px solid var(--moss); opacity: .3; animation: ring 1.8s ease-out infinite; }
.start-tag { position: absolute; bottom: calc(100% + 10px); left: 50%; padding: 7px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--moss-ink); font: 800 13px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; transform: translateX(-50%); animation: bob 1.5s ease-in-out infinite; }
.start-tag::after { content: ""; position: absolute; top: 100%; left: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.path-puffin { position: absolute; right: 0; top: 4px; display: grid; justify-items: center; pointer-events: none; }
.mini-bubble { order: -1; margin-bottom: 4px; padding: 6px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font: 800 14px/1 var(--font-body); color: var(--ink); }
.path-puffin .puffin { animation: float 3s ease-in-out infinite; }

.pop { width: min(100%, 340px); display: grid; gap: 12px; padding: 16px; border-radius: 18px; background: var(--moss); color: var(--on-moss); box-shadow: 0 5px 0 var(--moss-deep); animation: pop .16s ease-out; margin-top: -14px; }
.pop.done { background: var(--gorse); color: var(--on-gorse); box-shadow: 0 5px 0 var(--gorse-deep); }
.pop.locked { background: var(--surface); color: var(--ink-soft); border: 2px solid var(--line); box-shadow: none; }
.pop-title { font: 800 22px/1.15 var(--font-display); }
.pop-sub { font: 700 15px/1.35 var(--font-body); opacity: .92; }
.pop-note { margin: 0; font: 700 14px/1.4 var(--font-body); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px 18px; border: 0; border-radius: 16px; background: var(--moss); color: var(--on-moss); box-shadow: 0 4px 0 var(--moss-deep); font: 800 16px/1 var(--font-body); letter-spacing: .07em; text-transform: uppercase; transition: transform .06s, box-shadow .06s; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
.btn:disabled { background: var(--locked); color: var(--ink-soft); box-shadow: 0 4px 0 var(--line-deep); }
.btn.light { background: var(--surface); color: var(--moss-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--ink) 22%, transparent); }
.pop.done .btn.light { color: var(--gorse-ink); }
.btn.text { background: none; box-shadow: none; color: var(--atlantic-ink); }
.btn.text.danger { color: var(--fuchsia-ink); }
.btn .plus { opacity: .8; }

/* Lesson */
.lhead { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.iconbtn { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 12px; background: none; color: var(--ink-soft); }
.iconbtn svg { width: 26px; height: 26px; }
.bar { flex: 1; height: 16px; border-radius: 999px; background: var(--locked); overflow: hidden; }
.bar > i { position: relative; display: block; height: 100%; width: 0; border-radius: inherit; background: var(--moss); transition: width .4s cubic-bezier(.3, 1.3, .5, 1); }
.bar > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--surface) 40%, transparent); }
.stage { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-block: 8px 20px; }
.ask { margin: 0; font: 800 24px/1.2 var(--font-display); text-wrap: balance; }

.speaker { display: flex; align-items: flex-end; gap: 8px; }
.speaker .puffin { flex: none; }
.bubble { position: relative; min-width: 0; margin-bottom: 26px; padding: 12px 16px; border: 2px solid var(--line); border-radius: 18px; background: var(--surface); }
.bubble::before { content: ""; position: absolute; left: -8px; bottom: 16px; width: 14px; height: 14px; background: var(--surface); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.bubble .ga, .bubble .en-big { display: block; font: 800 22px/1.25 var(--font-body); }
.bubble .say-sm { display: block; margin-top: 4px; font: 700 14px/1.3 var(--font-body); color: var(--ink-soft); letter-spacing: .02em; }

.opts { display: grid; gap: 12px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; background: var(--surface); color: var(--ink); font: 700 18px/1.3 var(--font-body); text-align: left; }
.opt .k { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 8px; color: var(--ink-soft); font: 800 13px/1 var(--font-body); }
.opt[aria-pressed="true"] { border-color: var(--atlantic); background: var(--atlantic-tint); color: var(--atlantic-ink); }
.opt[aria-pressed="true"] .k { border-color: var(--atlantic); color: var(--atlantic-ink); }
.opt.is-right { border-color: var(--moss); background: var(--moss-tint); color: var(--moss-ink); }
.opt.is-wrong { border-color: var(--fuchsia); background: var(--fuchsia-tint); color: var(--fuchsia-ink); }

.answer { min-height: 112px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding-block: 4px; background-image: linear-gradient(var(--line), var(--line)), linear-gradient(var(--line), var(--line)); background-size: 100% 2px; background-position: 0 52px, 0 106px; background-repeat: no-repeat; }
.bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.tile { padding: 9px 14px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; background: var(--surface); color: var(--ink); font: 700 18px/1.2 var(--font-body); }
.tile.ghost { background: var(--locked); border-color: var(--locked); color: transparent; }

.typed { width: 100%; padding: 14px 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); font: 700 19px/1.3 var(--font-body); }
.typed:focus { outline: none; border-color: var(--atlantic); }
.fadas { display: flex; flex-wrap: wrap; gap: 8px; }
.fada { min-width: 46px; padding: 9px 10px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; background: var(--surface); color: var(--ink); font: 800 18px/1 var(--font-body); }
.hint { margin: 0; font: 600 14px/1.4 var(--font-body); color: var(--ink-soft); }

.match { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mcol { display: grid; gap: 12px; align-content: start; }
.mbtn { min-height: 58px; padding: 10px 12px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; background: var(--surface); color: var(--ink); font: 700 16px/1.25 var(--font-body); transition: opacity .3s; }
.mbtn[aria-pressed="true"] { border-color: var(--atlantic); background: var(--atlantic-tint); color: var(--atlantic-ink); }
.mbtn.ok { border-color: var(--moss); background: var(--moss-tint); color: var(--moss-ink); opacity: .45; }
.mbtn.bad { border-color: var(--fuchsia); background: var(--fuchsia-tint); color: var(--fuchsia-ink); animation: shake .35s; }

.newtag { display: inline-flex; align-items: center; gap: 8px; font: 800 13px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--atlantic-ink); }
.newtag svg { width: 20px; height: 20px; }
.card { display: grid; gap: 12px; padding: 20px; border: 2px solid var(--line); border-radius: 20px; background: var(--surface); }
.card .ga { font: 800 32px/1.15 var(--font-display); text-wrap: balance; }
.card .en { font: 700 19px/1.3 var(--font-body); color: var(--ink-soft); }
.say { display: inline-flex; align-items: center; gap: 8px; justify-self: start; padding: 8px 14px; border-radius: 999px; background: var(--gorse-tint); color: var(--gorse-ink); font: 800 17px/1.2 var(--font-body); letter-spacing: .03em; }
.say svg { width: 18px; height: 18px; flex: none; }
.nw { white-space: nowrap; }
.note { margin: 0; font: 600 15px/1.45 var(--font-body); color: var(--ink-soft); }
.hear { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hear-label { width: 100%; font: 700 13px/1.3 var(--font-body); color: var(--ink-soft); }
.hchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 2px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--atlantic-ink); font: 800 14px/1 var(--font-body); text-decoration: none; }
.hchip svg { width: 16px; height: 16px; }

.lfoot { display: grid; gap: 14px; margin-inline: -16px; padding: 14px 16px 16px; border-top: 2px solid var(--line); background: var(--bg); }
.lfoot.right { background: var(--moss-tint); border-top-color: transparent; }
.lfoot.wrong { background: var(--fuchsia-tint); border-top-color: transparent; }
.lfoot.wrong .btn { background: var(--fuchsia); color: var(--on-fuchsia); box-shadow: 0 4px 0 var(--fuchsia-deep); }
.fb { display: flex; align-items: flex-start; gap: 12px; animation: rise .2s ease-out; }
.fb-icon { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); }
.fb-icon svg { width: 26px; height: 26px; }
.lfoot.right .fb-icon, .lfoot.right .fb-title, .lfoot.right .fb-body { color: var(--moss-ink); }
.lfoot.wrong .fb-icon, .lfoot.wrong .fb-title, .lfoot.wrong .fb-body { color: var(--fuchsia-ink); }
.fb-text { min-width: 0; }
.fb-title { font: 800 22px/1.15 var(--font-display); }
.fb-gloss { margin-left: 8px; font: 700 14px/1 var(--font-body); opacity: .85; }
.fb-body { margin-top: 4px; font: 600 16px/1.45 var(--font-body); }
.fb-body b { font-weight: 900; }

/* Lesson complete */
.done-wrap { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding-block: 24px; text-align: center; }
.done-title { margin: 0; font: 800 34px/1.1 var(--font-display); color: var(--gorse-ink); text-wrap: balance; }
.done-ga { font: 400 20px/1.2 var(--font-gael); color: var(--ink-soft); }
.tiles3 { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stile { border: 2px solid var(--c); border-radius: 16px; background: var(--c); overflow: hidden; }
.stile .h { padding: 6px 4px 5px; font: 800 12px/1.1 var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--on-c); }
.stile .v { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 4px; border-radius: 13px; background: var(--surface); color: var(--c-ink); font: 800 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stile .v svg { width: 20px; height: 20px; flex: none; }
.streak-line { display: inline-flex; align-items: center; gap: 8px; font: 800 19px/1.2 var(--font-display); color: var(--turf); animation: cheer .6s ease-out; }
.streak-line svg { width: 28px; height: 28px; }
.cfoot { padding-block: 14px 16px; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

/* Phrasebook + profile */
.h1 { margin: 0; font: 800 28px/1.15 var(--font-display); }
.h2 { margin: 10px 0 0; font: 800 20px/1.2 var(--font-display); }
.muted { margin: 0; font: 600 14px/1.5 var(--font-body); color: var(--ink-soft); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; padding: 4px; border-radius: 14px; background: var(--locked); }
.seg button { display: grid; gap: 2px; padding: 9px 6px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-soft); font: 800 14px/1.1 var(--font-body); }
.seg button small { font: 700 12px/1.1 var(--font-body); opacity: .85; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--atlantic-ink); box-shadow: 0 2px 0 var(--line-deep); }
.tips { display: grid; gap: 10px; }
.tip { display: grid; gap: 4px; padding: 14px; border-radius: 16px; background: var(--atlantic-tint); }
.tip-t { font: 800 16px/1.2 var(--font-display); color: var(--atlantic-ink); }
.tip p { margin: 0; font: 600 15px/1.45 var(--font-body); color: var(--ink); }
.pb-section { display: grid; gap: 10px; }
.pb-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 10px 0 0; font: 800 21px/1.2 var(--font-display); }

  const pickD = (v, d) => (v && typeof v === "object" && !Array.isArray(v)) ? (d in v ? v[d] : v.M) : v;
  const gaOf = (id, d = S.dialect) => pickD(PHRASES[id].ga, d);
  const sayOf = (id, d = S.dialect) => pickD(PHRASES[id].say, d);
  const noteOf = (id, d = S.dialect) => pickD(PHRASES[id].note, d) || "";
  const hearOf = (id, d = S.dialect) => pickD(PHRASES[id].hear, d) || [];
  const altOf = (id, d) => pickD(PHRASES[id].alt, d) || [];

  const bare = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");

  const dayGap = (a, b) => { const p = k => { const [y, m, d] = k.split("-").map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 86400000); };

  /* ---------- Saved progress ---------- */

  function migrate(s) {
    const out = fresh();

    } catch (e) {

        try { await cloudRef.set(JSON.parse(JSON.stringify(S))); } catch (e2) { /* next save retries */ }

  }

  /* ---------- Lessons ---------- */
  let run = null;

  function makeEx(type, id, pool) {
    if (type === "tiles" && words(gaOf(id)).length < 2) type = "type";
    if (type === "pickEn" || type === "pickGa") {
      const others = shuffle(pool.filter(x => x !== id && gaOf(x) !== gaOf(id)));
      const more = shuffle(ALL_IDS.filter(x => x !== id && !others.includes(x) && gaOf(x) !== gaOf(id)));
      return { type, id, options: shuffle([id, ...others.concat(more).slice(0, 3)]) };
    }
    if (type === "tiles") return { type, id, bank: buildBank(id, pool) };
    return { type, id };
  }

  function buildBank(id, pool) {
    const target = words(gaOf(id));
    const taken = new Set(target.map(w => w.toLowerCase()));
    const cands = [];
    for (const x of shuffle(pool.concat(ALL_IDS))) {
      if (x === id) continue;
      for (const raw of words(gaOf(x))) {
        const w = PROPER.has(raw) ? raw : raw.toLowerCase();
        if (taken.has(w.toLowerCase())) continue;
        taken.add(w.toLowerCase());
        cands.push(w);
      }
    }
    const extra = sample(cands, target.length <= 2 ? 3 : 4);
    return shuffle(target.concat(extra)).map((w, i) => ({ w, i }));
  }

  function buildPlan(L) {
    if (L.review) {
      const ids = sample(ALL_IDS, 9);
      const types = ["pickEn", "tiles", "pickGa", "type", "tiles", "pickEn", "tiles", "type", "pickGa"];
      const steps = ids.map((id, k) => makeEx(types[k], id, ALL_IDS));
      steps.splice(4, 0, { type: "match", ids: sample(ALL_IDS.filter(x => !ids.slice(0, 4).includes(x)), 5) });
      return steps;
    }
    const ids = L.phrases, steps = [];
    ids.forEach((id, k) => {
      steps.push({ type: "intro", id });
      steps.push(makeEx(k % 2 ? "pickGa" : "pickEn", id, ids));
    });
    steps.push({ type: "match", ids: sample(ids, Math.min(5, ids.length)) });
    sample(ids, 4).forEach((id, k) => steps.push(makeEx(k % 2 ? "type" : "tiles", id, ids)));
    return steps;
  }

  function startLesson(i) {
    const L = UNIT.lessons[i];
    const plan = buildPlan(L).map((s, k) => Object.assign(s, { key: k }));
    run = { i, L, pool: L.review ? ALL_IDS : L.phrases, queue: plan, total: plan.length, done: 0, graded: new Set(), right: 0, mistakes: 0, t0: Date.now(), cur: null, answered: false, lastOk: false };

  function setProgress() {

  function setCheck(enabled, label) {

  function nextStep() {
    if (!run.queue.length) return finishLesson();
    run.cur = run.queue.shift();
    run.answered = false;
    run.sel = null;
    run.tiles = [];
    const foot = $("#lfoot");
    foot.classList.remove("right", "wrong");
    $("#fb").hidden = true;
    $("#fb").innerHTML = "";
    setProgress();
    const s = run.cur, stage = $("#stage");
    stage.scrollTop = 0;
    if (s.type === "intro") {
      stage.innerHTML = `
        <div class="newtag">${I.sparkle}<span>New phrase</span></div>

          <div class="say">${I.speech}<span>${sayHtml(sayOf(s.id))}</span></div>
          ${noteOf(s.id) ? `<p class="note">${esc(noteOf(s.id))}</p>` : ""}
          ${hearHtml(s.id)}
        </div>`;
      setCheck(true, "Continue");
      return;
    }
    if (s.type === "pickEn" || s.type === "pickGa") {
      const toEn = s.type === "pickEn";
      stage.innerHTML = `
        <h2 class="ask">${toEn ? "What does this mean?" : `How do you say “${esc(PHRASES[s.id].en)}”?`}</h2>
        ${toEn ? `<div class="speaker">${puffin(84)}<div class="bubble"><span class="ga" lang="ga">${esc(gaOf(s.id))}</span><span class="say-sm">${sayHtml(sayOf(s.id))}</span></div></div>` : ""}
        <div class="opts">${s.options.map((id, k) => `<button class="opt" data-act="opt" data-id="${id}" aria-pressed="false"><span class="k">${k + 1}</span><span${toEn ? "" : ' lang="ga"'}>${esc(toEn ? PHRASES[id].en : gaOf(id))}</span></button>`).join("")}</div>`;
      setCheck(false, "Check");
      return;
    }
    if (s.type === "tiles") {
      stage.innerHTML = `
        <h2 class="ask">Write this in Irish</h2>
        <div class="speaker">${puffin(84)}<div class="bubble"><span class="en-big">${esc(PHRASES[s.id].en)}</span></div></div>
        <div class="answer" id="answer" aria-label="Your answer" aria-live="polite"></div>
        <div class="bank" id="bank">${s.bank.map(t => `<button class="tile" data-act="tile" data-i="${t.i}" lang="ga">${esc(t.w)}</button>`).join("")}</div>`;
      setCheck(false, "Check");
      return;
    }
    if (s.type === "type") {
      stage.innerHTML = `
        <h2 class="ask">Type this in Irish</h2>
        <div class="speaker">${puffin(84)}<div class="bubble"><span class="en-big">${esc(PHRASES[s.id].en)}</span></div></div>
        <input class="typed" id="typed" type="text" lang="ga" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type in Irish" aria-label="Your answer in Irish">
        <div class="fadas" aria-label="Letters with a fada">${["á", "é", "í", "ó", "ú"].map(c => `<button class="fada" data-act="fada" data-c="${c}" aria-label="Type ${c}">${c}</button>`).join("")}</div>
        <p class="hint">Answers in any dialect count.</p>`;
      setCheck(false, "Check");
      const inp = $("#typed");
      if (window.matchMedia && matchMedia("(pointer: fine)").matches) inp.focus();
      return;
    }
    if (s.type === "match") {
      run.m = { l: null, r: null, done: new Set() };
      const left = shuffle(s.ids), right = shuffle(s.ids);
      stage.innerHTML = `
        <h2 class="ask">Tap the matching pairs</h2>
        <div class="match">
          <div class="mcol">${left.map(id => `<button class="mbtn" data-act="m" data-side="l" data-id="${id}" aria-pressed="false" lang="ga">${esc(gaOf(id))}</button>`).join("")}</div>
          <div class="mcol">${right.map(id => `<button class="mbtn" data-act="m" data-side="r" data-id="${id}" aria-pressed="false">${esc(PHRASES[id].en)}</button>`).join("")}</div>
        </div>`;
      setCheck(false, "Check");
    }
  }

  function pickOpt(btn) {
    if (!run || run.answered) return;
    $$(".opt").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    run.sel = btn.dataset.id;
    setCheck(true);
    SFX.tap();
  }

  function tapTile(i) {
    if (!run || run.answered) return;
    const s = run.cur;
    const at = run.tiles.findIndex(t => t.i === i);
    if (at >= 0) run.tiles.splice(at, 1);
    else run.tiles.push(s.bank.find(t => t.i === i));
    $("#answer").innerHTML = run.tiles.map(t => `<button class="tile" data-act="tile" data-i="${t.i}" lang="ga">${esc(t.w)}</button>`).join("");
    $$("#bank .tile").forEach(b => {
      const used = run.tiles.some(t => t.i === Number(b.dataset.i));
      b.classList.toggle("ghost", used);
      b.disabled = used;
    });
    setCheck(run.tiles.length > 0);
    SFX.tap();
  }

  function tapMatch(btn) {
    if (!run || run.answered) return;
    const m = run.m, side = btn.dataset.side, id = btn.dataset.id;
    if (m.done.has(id)) return;
    $$(`.mbtn[data-side="${side}"]`).forEach(b => { if (!b.classList.contains("ok")) b.setAttribute("aria-pressed", "false"); });
    if (m[side] === id) { m[side] = null; return; }
    m[side] = id;
    btn.setAttribute("aria-pressed", "true");
    if (!m.l || !m.r) { SFX.tap(); return; }
    const lb = $(`.mbtn[data-side="l"][data-id="${m.l}"]`), rb = $(`.mbtn[data-side="r"][data-id="${m.r}"]`);
    if (m.l === m.r) {
      m.done.add(m.l);
      [lb, rb].forEach(b => { b.classList.add("ok"); b.disabled = true; b.setAttribute("aria-pressed", "false"); });
      SFX.pair();
      if (m.done.size === run.cur.ids.length) setTimeout(() => answer({ ok: true }), 250);
    } else {
      [lb, rb].forEach(b => { b.classList.add("bad"); b.setAttribute("aria-pressed", "false"); setTimeout(() => b.classList.remove("bad"), 400); });
      SFX.wrong();
      buzz();
    }
    m.l = m.r = null;
  }

  function insertFada(c) {
    const inp = $("#typed");
    if (!inp || run.answered) return;
    const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? inp.value.length;
    inp.value = inp.value.slice(0, a) + c + inp.value.slice(b);
    inp.focus();
    inp.setSelectionRange(a + 1, a + 1);
    setCheck(inp.value.trim().length > 0);
  }

  /* Accepts every dialect's wording; flags a missing fada or a different dialect. */
  function grade(id, input) {
    const n = norm(input);
    if (!n) return { ok: false };
    const forms = {};
    DKEYS.forEach(d => { forms[d] = [gaOf(id, d), ...altOf(id, d)]; });
    const order = [S.dialect, ...DKEYS.filter(d => d !== S.dialect)];
    let hit = null, slip = false;
    for (const loose of [false, true]) {
      for (const d of order) {
        hit = forms[d].find(t => loose ? bare(norm(t)) === bare(n) : norm(t) === n);
        if (hit) break;
      }
      if (hit) { slip = loose; break; }
    }
    if (!hit) return { ok: false };
    const same = t => norm(t) === norm(hit);
    const mine = forms[S.dialect].some(same);
    const who = mine ? null : DKEYS.filter(d => forms[d].some(same)).map(d => DIALECTS[d].name).join(" and ");
    return { ok: true, fadaSlip: slip, form: hit, otherDialects: who };
  }

  function onCheck() {
    if (!run) return;
    if (run.answered) {
      if (run.lastOk) run.done++;
      return nextStep();
    }
    const s = run.cur;
    if (s.type === "intro") { run.done++; return nextStep(); }
    let res;
    if (s.type === "pickEn" || s.type === "pickGa") {
      if (!run.sel) return;
      res = { ok: run.sel === s.id };
      $$(".opt").forEach(b => {
        b.disabled = true;
        if (b.dataset.id === s.id) b.classList.add("is-right");
        else if (b.dataset.id === run.sel) b.classList.add("is-wrong");
      });
    } else if (s.type === "tiles") {
      if (!run.tiles.length) return;
      res = grade(s.id, run.tiles.map(t => t.w).join(" "));
      $$("#answer .tile, #bank .tile").forEach(b => { b.disabled = true; });
    } else if (s.type === "type") {
      const inp = $("#typed");
      if (!inp.value.trim()) return;
      res = grade(s.id, inp.value);
      inp.readOnly = true;
      $$(".fada").forEach(b => { b.disabled = true; });
    } else {
      return;
    }
    answer(res);
  }

  function answer(res) {
    const s = run.cur;
    run.answered = true;
    run.lastOk = res.ok;
    if (s.type !== "intro" && !run.graded.has(s.key)) {
      run.graded.add(s.key);
      if (res.ok) run.right++;
    }
    if (!res.ok) {
      run.mistakes++;
      const again = s.type === "pickEn" || s.type === "pickGa" || s.type === "tiles" ? makeEx(s.type, s.id, run.pool) : { type: s.type, id: s.id };
      run.queue.push(Object.assign(again, { key: s.key }));
    }
    showFeedback(res);
  }

  function showFeedback(res) {
    const s = run.cur, foot = $("#lfoot"), fb = $("#fb");
    foot.classList.add(res.ok ? "right" : "wrong");
    let title, body = "";
    const line = id => `<b lang="ga">${esc(gaOf(id))}</b> · ${sayHtml(sayOf(id))}`;
    if (res.ok) {
      const [ga, gloss] = PRAISE[Math.floor(Math.random() * PRAISE.length)];
      title = `<span lang="ga">${ga}</span><span class="fb-gloss">${gloss}</span>`;
      const lines = [];
      if (res.fadaSlip) lines.push(`Watch the fadas: <b lang="ga">${esc(res.form)}</b>`);
      if (res.otherDialects) lines.push(`That's how they say it in ${esc(res.otherDialects)}. In ${DIALECTS[S.dialect].name} it's usually <b lang="ga">${esc(gaOf(s.id))}</b>.`);
      if (!lines.length && s.type !== "match") lines.push(line(s.id));
      body = lines.join("<br>");
    } else {
      title = "Correct answer:";
      body = s.type === "pickEn" ? `<b>${esc(PHRASES[s.id].en)}</b><br>${line(s.id)}` : line(s.id);
    }
    fb.innerHTML = `<div class="fb-icon">${res.ok ? I.check : I.close}</div><div class="fb-text"><div class="fb-title">${title}</div>${body ? `<div class="fb-body">${body}</div>` : ""}</div>`;
    fb.hidden = false;
    setCheck(true, res.ok ? "Continue" : "Got it");
    $("#check").focus({ preventScroll: true });
    if (res.ok) SFX.right(); else { SFX.wrong(); buzz(); }
  }

  function finishLesson() {
    const L = run.L;
    const perfect = run.mistakes === 0;
    const earned = 10 + (perfect ? 5 : 0);
    const acc = run.graded.size ? Math.round(100 * run.right / run.graded.size) : 100;
    const secs = Math.max(1, Math.round((Date.now() - run.t0) / 1000));
    const today = dayKey();
    let streakUp = false;
    if (S.lastDay !== today) {
      const gap = S.lastDay ? dayGap(S.lastDay, today) : null;
      S.streak = gap === 1 ? S.streak + 1 : 1;
      S.lastDay = today;
      streakUp = true;
    }
    if (S.todayDate !== today) { S.todayDate = today; S.todayXp = 0; }
    S.todayXp += earned;
    S.xp += earned;
    const prev = S.done[L.id];
    S.done[L.id] = { best: Math.max(prev ? prev.best : 0, acc), times: (prev ? prev.times : 0) + 1 };
    save();
    run.done = run.total;
    renderComplete({ earned, acc, secs, perfect, streakUp });
  }

  function statTile(label, icon, value, c) {
    return `<div class="stile" style="--c:var(--${c});--on-c:var(--on-${c});--c-ink:var(--${c}-ink)">
        <div class="h">${label}</div>
        <div class="v">${icon}<span>${value}</span></div>
      </div>`;
  }

  function renderComplete(r) {
    $("#complete").innerHTML = `
      <div class="done-wrap">
        ${puffin(150, "happy")}
        <h1 class="done-title">${r.perfect ? "Perfect lesson!" : "Lesson complete!"}</h1>
        <div class="done-ga" lang="ga">Ceacht críochnaithe!</div>
        <div class="tiles3">
          ${statTile("Total XP", I.bolt, "+" + r.earned, "gorse")}
          ${statTile("Accuracy", I.target, r.acc + "%", "moss")}
          ${statTile("Time", I.clock, fmtTime(r.secs), "atlantic")}
        </div>
        ${r.streakUp ? `<div class="streak-line">${I.flame}<span>${S.streak} day streak!</span></div>` : ""}
      </div>
      <div class="cfoot"><button class="btn" data-act="home">Continue</button></div>`;
    show("complete");
    $("#complete .btn").focus({ preventScroll: true });
    SFX.done();
    confetti();
  }

  function confetti() {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.createElement("canvas");
    c.className = "confetti";
    document.body.appendChild(c);
    const ctx = c.getContext("2d");
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
    const cs = getComputedStyle(document.documentElement);
    const cols = ["--moss", "--gorse", "--turf", "--atlantic", "--fuchsia"].map(v => cs.getPropertyValue(v).trim() || "#f3b604");
    const parts = Array.from({ length: 140 }, () => ({
      x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.38,
      vx: (Math.random() - 0.5) * 16 * dpr, vy: (-Math.random() * 15 - 6) * dpr,
      r: (4 + Math.random() * 5) * dpr, a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.3,
      col: cols[Math.floor(Math.random() * cols.length)],
    }));
    const t0 = performance.now();
    (function frame(t) {
      if (!c.isConnected) return;
      const el = t - t0;
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = Math.max(0, 1 - el / 2600);
      for (const p of parts) {
        p.vy += 0.45 * dpr; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col;
        ctx.fillRect(-p.r, -p.r * 0.45, p.r * 2, p.r * 0.9); ctx.restore();
      }
      if (el < 2600) requestAnimationFrame(frame); else c.remove();
    })(t0);
  }

  function confirmQuit() {
    openSheet(`<div class="sheet-puffin">${puffin(84)}</div>
      <h2 class="sheet-t">Leave this lesson?</h2>
      <p class="muted">You'll lose your progress in this lesson.</p>
      <button class="btn" data-act="close-sheet">Keep learning</button>
      <button class="btn text danger" data-act="quit-confirm">Leave lesson</button>`);
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act]");
    if (!t || t.disabled) return;
    switch (t.dataset.act) {
      case "tab": setTab(t.dataset.tab); break;
      case "node": { const i = Number(t.dataset.i); openNode = openNode === i ? null : i; renderLearn(); const b = $(`.node[data-i="${i}"]`); if (b) b.focus({ preventScroll: true }); break; }
      case "start": startLesson(Number(t.dataset.i)); break;
      case "dialect": dialectSheet(); break;
      case "set-dialect": setDialect(t.dataset.d); break;
      case "goal": S.goal = Number(t.dataset.n); save(); renderHome(); break;
      case "sound": S.sound = !S.sound; save(); renderProfile(); if (S.sound) SFX.right(); break;
      case "reset": resetAsk = true; renderProfile(); break;
      case "reset-no": resetAsk = false; renderProfile(); break;
      case "reset-yes": { const keep = { dialect: S.dialect, sound: S.sound, goal: S.goal }; S = Object.assign(fresh(), keep); resetAsk = false; save(); renderHome(); break; }
      case "scrim": if (e.target === t) closeSheet(); break;
      case "close-sheet": closeSheet(); break;
      case "quit": confirmQuit(); break;
      case "quit-confirm": closeSheet(); goHome(); break;
      case "check": onCheck(); break;
      case "opt": pickOpt(t); break;
      case "tile": tapTile(Number(t.dataset.i)); break;
      case "m": tapMatch(t); break;
      case "fada": insertFada(t.dataset.c); break;
      case "home": goHome(); break;
    }
  });
  document.addEventListener("pointerdown", e => { if (e.target.closest(".fada")) e.preventDefault(); });
  document.addEventListener("input", e => { if (e.target.id === "typed" && run && !run.answered) setCheck(e.target.value.trim().length > 0); });
  document.addEventListener("keydown", e => {
    const sheetOpen = !$("#sheet").hidden;
    if (e.key === "Escape" && sheetOpen) { closeSheet(); return; }
    if (sheetOpen || $("#lesson").hidden || !run) return;
    if (e.key === "Enter" && !e.target.closest("button, a")) {
      const b = $("#check");
      if (!b.disabled) { e.preventDefault(); onCheck(); }
      return;
    }
    if (/^[1-4]$/.test(e.key) && e.target.id !== "typed" && !run.answered) {
      const opt = $$(".opt")[Number(e.key) - 1];
      if (opt) pickOpt(opt);
    }
  });

  if (/[?&]test\b/.test(location.search)) {
    window.__cf = { get run() { return run; }, get S() { return S; }, gaOf, PHRASES, grade };
  }

  /* ---------- Boot ---------- */
  function start(data) {
    if (data && data.S && (data.S.updatedAt || 0) >= (S.updatedAt || 0)) S = migrate(data.S);
    renderHome();
    show("home");
    connectCloud();
  }
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ S })); } catch (e) { /* no hot reload here */ }
  if (hot && typeof hot.ready === "function") hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
